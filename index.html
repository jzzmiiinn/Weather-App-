<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Weather app</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              dm: ["DM Sans", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body
    class="bg-[hsl(243,96%,9%)] text-white px-4 py-6 sm:px-6 lg:px-10 xl:px-20 font-dm"
  >
    <header class="flex flex-row justify-between items-center">
      <img src="assets/images/logo.svg" alt="lOGO" class="h-[35px]" />
      <div class="relative" id="units-dropdown-wrapper">
        <button
          id="units-btn"
          type="button"
          class="flex items-center gap-2 bg-[hsl(243,23%,24%)] hover:bg-[hsl(243,23%,30%)] border border-slate-700 text-slate-200 py-2.5 px-4 rounded-lg text-sm font-medium transition-all focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <img
            src="assets/images/icon-units.svg"
            alt=""
            class="h-[15px] sm:h-[20px]"
          />
          <span>Units</span>
          <svg class="w-4 h-4 fill-current text-slate-400" viewBox="0 0 20 20">
            <path
              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
            />
          </svg>
        </button>

        <div
          id="units-menu"
          class="hidden absolute right-0 mt-2 w-64 bg-[hsl(243,27%,20%)] border border-slate-700 rounded-xl shadow-xl z-50 p-2"
        >
          <button
            id="unit-toggle"
            data-system="metric"
            class="unit-system-btn w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm"
          >
            Switch to Imperial
          </button>

          <div class="border-t border-slate-700 my-2"></div>

          <div class="px-3 py-1 text-xs font-semibold text-slate-400">
            Temperature
          </div>
          <button
            data-type="temperature"
            data-value="celsius"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>Celsius (°C)</span>
            <span class="check hidden">✓</span>
          </button>
          <button
            data-type="temperature"
            data-value="fahrenheit"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>Fahrenheit (°F)</span>
            <span class="check hidden">✓</span>
          </button>

          <div class="border-t border-slate-700 my-2"></div>

          <div class="px-3 py-1 text-xs font-semibold text-slate-400">
            Wind Speed
          </div>
          <button
            data-type="wind"
            data-value="kmh"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>km/h</span>
            <span class="check hidden">✓</span>
          </button>
          <button
            data-type="wind"
            data-value="mph"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>mph</span>
            <span class="check hidden">✓</span>
          </button>

          <div class="border-t border-slate-700 my-2"></div>

          <div class="px-3 py-1 text-xs font-semibold text-slate-400">
            Precipitation
          </div>
          <button
            data-type="precipitation"
            data-value="mm"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>Millimeters (mm)</span>
            <span class="check hidden">✓</span>
          </button>
          <button
            data-type="precipitation"
            data-value="inch"
            class="unit-option w-full text-left px-3 py-2 rounded-lg hover:bg-[hsl(243,23%,30%)] text-sm flex justify-between"
          >
            <span>Inches (in)</span>
            <span class="check hidden">✓</span>
          </button>
        </div>
      </div>
    </header>
    <h1
      class="text-white font-bold text-center my-8 sm:my-10 mx-2 sm:mx-10 text-3xl sm:text-4xl lg:text-5xl"
    >
      How's the sky looking today?
    </h1>
    <section class="flex items-center justify-center mt-10 sm:mt-15">
      <form
        action=""
        class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-4 w-full max-w-[700px] relative"
        id="search-form"
      >
        <!-- Input container (make it relative) -->
        <div
          id="input-container"
          class="bg-[hsl(243,23%,24%)] w-full h-[45px] relative flex items-center rounded-lg px-3 py-2"
        >
          <img
            src="assets/images/icon-search.svg"
            alt="Search"
            id="input-icon"
            class="bg-[hsl(243,23%,24%)] m-2"
          />

          <input
            type="text"
            placeholder="Search for a place..."
            id="search"
            autocomplete="off"
            class="w-full border-none bg-[hsl(243,23%,24%)] text-white outline-none placeholder:text-gray-400 focus:bg-[hsl(243,23%,24%)] focus:text-white autofill:bg-[hsl(243,23%,24%)] autofill:text-white"
          />

          <!-- Suggestions dropdown - positioned below the input -->
          <div
            id="suggestions"
            class="absolute top-full left-0 right-0 z-50 mt-1 bg-[hsl(243,27%,20%)] border border-[hsl(243,23%,30%)] rounded-lg max-h-60 overflow-y-auto shadow-lg hidden"
          ></div>
        </div>

        <button
          type="submit"
          id="search-button"
          class="w-full sm:w-auto bg-[hsl(233,67%,56%)] px-6 py-2.5 rounded-lg text-white hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Search
        </button>
      </form>
    </section>
    <section
      class="flex flex-col items-center justify-center lg:flex-row gap-6 max-w-[900px] mx-auto lg:items-start mt-12 lg:mt-20 mb-10"
      id="weatherApp"
    >
      <div class="flex flex-col w-full lg:w-[700px]">
        <section
          id="weatherCard"
          class="bg-[url('assets/images/bg-today-large.svg')] w-full h-[180px] sm:h-[200px] rounded-lg py-3 px-4 sm:px-5 bg-cover bg-center"
        ></section>

        <section
          id="weatherStats"
          class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5 w-full"
        ></section>

        <section>
          <h2 class="mt-8 font-bold text-xl">Daily forecast</h2>
          <div
            id="dailyForecast"
            class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 sm:gap-4 mt-5 w-full"
          ></div>
        </section>
      </div>

      <section
        class="w-full lg:w-[350px] bg-[hsl(243,27%,20%)] rounded-lg p-4 sm:p-5"
      >
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-xl">Hourly forecast</h2>

          <div class="relative" id="days-dropdown-wrapper">
            <button
              id="days-btn"
              type="button"
              class="flex items-center gap-2 bg-[hsl(243,23%,30%)] hover:bg-[hsl(243,23%,35%)] border border-slate-700 text-slate-200 py-2 px-3 rounded-lg text-sm font-medium transition-all focus:outline-none"
            >
              <span id="selected-day">Today</span>

              <svg
                class="w-4 h-4 fill-current text-slate-400"
                viewBox="0 0 20 20"
              >
                <path
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                />
              </svg>
            </button>

            <div
              id="days-menu"
              class="hidden absolute right-0 mt-2 w-40 bg-[hsl(243,27%,20%)] border border-slate-700 rounded-xl shadow-xl z-50 p-2"
            ></div>
          </div>
        </div>

        <div
          id="hourlyForecast"
          class="mt-5 max-h-[400px] overflow-y-auto"
        ></div>
      </section>
    </section>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Yasmin Ali</a>.
    </footer>
  </body>
  <script src="script.js"></script>
</html>
