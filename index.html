<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Weather app</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              dm: ["DM Sans", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body
    class="bg-[hsl(243,96%,9%)] text-white px-20 py-12 items-center font-dm"
  >
    <section class="flex flex-row justify-between items-center">
      <img src="assets/images/logo.svg" alt="lOGO" class="h-[35px]" />
      <div class="flex flex-row gap-3 items-center">
        <div class="relative inline-block w-64">
          <select
            id="weather-data"
            class="w-full appearance-none bg-[hsl(243,96%,9%)] border border-slate-700 text-slate-200 py-2.5 px-4 pr-10 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all cursor-pointer text-sm font-medium"
          >
            <optgroup
              label="Switch Unit System"
              class="bg-[hsl(243,96%,9%)] text-slate-400 font-semibold italic"
            >
              <option
                value="celsius"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                Celsius (°C)
              </option>
              <option
                value="fahrenheit"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                Fahrenheit (°F)
              </option>
            </optgroup>

            <optgroup
              label="Wind Speed"
              class="bg-[hsl(243,96%,9%)] text-slate-400 font-semibold italic"
            >
              <option
                value="kmh"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                km/h
              </option>
              <option
                value="mph"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                mph
              </option>
            </optgroup>

            <optgroup
              label="Precipitation"
              class="bg-[hsl(243,96%,9%)] text-slate-400 font-semibold italic"
            >
              <option
                value="mm"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                Millimeters (mm)
              </option>
              <option
                value="in"
                class="text-slate-200 font-normal not-italic bg-[hsl(243,96%,9%)] py-1"
              >
                Inches (in)
              </option>
            </optgroup>
          </select>

          <!-- Custom Dropdown Icon -->
          <div
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"
          >
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
              <path
                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              />
            </svg>
          </div>
        </div>
      </div>
    </section>
    <h1 class="text-white text-5xl font-bold text-center my-10 mx-10">
      How's the sky looking today?
    </h1>
    <section class="flex gap-3 items-center justify-center mt-15">
      <form action="" class="flex items-center gap-4" id="search-form">
        <div
          id="input-container"
          class="bg-[hsl(243,23%,24%)] w-[480px] h-[45px] relative flex items-center rounded-lg px-3 py-2"
        >
          <img
            src="assets/images/icon-search.svg"
            alt="Search"
            id="input-icon"
            class="bg-[hsl(243,23%,24%)] m-2"
          />

          <input
            type="text"
            placeholder="Search for a place..."
            id="search"
            class="bg-transparent w-[450px] outline-none border-none focus:outline-none focus:ring-0"
          />
        </div>
        <button
          type="submit"
          id="search-button"
          class="bg-[hsl(233,67%,56%)] px-3 py-2.5 rounded-lg text-white hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Search
        </button>
      </form>
    </section>
    <section
      class="flex justify-between items-start mt-20 gap-5 mb-10"
      id="weatherApp"
    >
      <div class="flex flex-col">
        <section
          id="weatherCard"
          class="bg-[url('assets/images/bg-today-large.svg')] w-[700px] h-[200px] rounded-lg py-3 px-5 bg-cover bg-center"
        >
          <div class="flex justify-between items-center h-full">
            <div>
              <p id="place" class="text-xl font-semibold">Berlin, Germany</p>
              <p id="date" class="text-sm opacity-80">
                Tuesday, August 5, 2025
              </p>
            </div>

            <p id="temperature" class="text-6xl font-bold">20°</p>
          </div>
        </section>

        <section
          id="weatherStats"
          class="flex justify-between mt-5 w-[700px]"
        ></section>

        <section>
          <h2 class="mt-8 font-bold text-xl">Daily forecast</h2>
          <div
            id="dailyForecast"
            class="flex gap-4 mt-5 max-w-[700px] overflow-x-auto pb-2"
          ></div>
        </section>
      </div>

      <section class="w-[350px] bg-[hsl(243,27%,20%)] rounded-lg p-5">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-xl">Hourly forecast</h2>

          <div
            class="flex items-center gap-2 bg-[hsl(243,23%,30%)] border border-slate-700 rounded-lg px-3 py-1.5 shadow-sm w-fit"
          >
            <select
              id="category"
              class="bg-transparent text-slate-200 text-sm font-medium focus:outline-none cursor-pointer py-1 pr-2 border-none appearance-none"
            >
              <option value="0" class="bg-[hsl(243,96%,9%)] text-slate-200">
                Today
              </option>
            </select>

            <svg
              class="w-4 h-4 text-slate-400 pointer-events-none fill-current"
              viewBox="0 0 20 20"
            >
              <path
                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              />
            </svg>
          </div>
        </div>

        <div
          id="hourlyForecast"
          class="mt-5 max-h-[400px] overflow-y-auto"
        ></div>
      </section>
    </section>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Yasmin Ali</a>.
    </footer>
  </body>
  <script src="script.js"></script>
</html>
